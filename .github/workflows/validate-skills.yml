name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "partner-skills/**/SKILL.md"
      - "schema/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/**"
      - "package.json"
      - "tsconfig.json"
      - "SKILL_TEMPLATE.md"
      - "SKILL_TEMPLATE_402.md"

jobs:
  validate:
    name: Validate SKILL.md files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install validator dependencies
        working-directory: scripts
        run: npm install

      - name: Run skill validation
        working-directory: scripts
        run: node validate-skills.js

  capability-audit:
    name: Audit declared capabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run capability audit
        working-directory: scripts
        run: node audit-capabilities.js

  lint:
    name: Lint skill files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint .

  typecheck:
    name: Typecheck runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  bundle-manifest:
    name: Generate bundle manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Generate bundle manifest
        working-directory: scripts
        run: node generate-bundle-manifest.js

      - name: Upload bundle manifest
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: bundle-manifest.json

  version-check:
    name: Check version bump on modified skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout base branch for comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check for version bumps
        shell: bash
        run: |
          changed_skills=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- 'skills/**/SKILL.md' 'partner-skills/**/SKILL.md')

          if [ -z "$changed_skills" ]; then
            echo "No SKILL.md files modified."
            exit 0
          fi

          errors=0
          for file in $changed_skills; do
            if [ ! -f "base/$file" ]; then
              echo "NEW   $file (no version check needed)"
              continue
            fi

            head_version=$(grep -m1 '^version:' "$file" | sed 's/version: *//' | tr -d '[:space:]')
            base_version=$(grep -m1 '^version:' "base/$file" | sed 's/version: *//' | tr -d '[:space:]')

            if [ "$head_version" = "$base_version" ]; then
              echo "FAIL  $file: version unchanged ($base_version). Bump the version field."
              errors=$((errors + 1))
            else
              echo "PASS  $file: $base_version -> $head_version"
            fi
          done

          if [ $errors -gt 0 ]; then
            echo ""
            echo "$errors skill(s) modified without a version bump."
            exit 1
          fi
